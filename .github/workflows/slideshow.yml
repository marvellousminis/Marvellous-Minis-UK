# Whenever a photo is added to or removed from assets/slideshow/, this
# converts it to a web-friendly WebP, shrinks it, and refreshes the list the
# homepage slideshow reads. Nobody needs to touch any code.

name: Prepare slideshow photos

on:
  push:
    branches: [main]
    paths:
      - 'assets/slideshow/**'
  workflow_dispatch:

concurrency:
  group: slideshow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # heif-convert reads the .HEIC files iPhones produce, but only once the
      # HEVC decoder plugin is present — without it every iPhone photo fails
      # with "Unsupported codec". ffmpeg is the backup decoder.
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libheif-examples imagemagick jq
          sudo apt-get install -y -qq libheif-plugin-libde265 || echo "decoder plugin unavailable, ffmpeg will cover HEIC"

      - name: Convert photos to WebP
        run: |
          set -uo pipefail
          mkdir -p assets/slideshow
          shopt -s nullglob nocaseglob

          # Try the dedicated HEIC tool, then ffmpeg. A photo we cannot read
          # is left alone and reported, rather than failing the whole run.
          decode_to_png() {
            heif-convert "$1" "$2" >/dev/null 2>&1 && [ -s "$2" ] && return 0
            ffmpeg -y -loglevel error -i "$1" "$2" >/dev/null 2>&1 && [ -s "$2" ] && return 0
            return 1
          }

          failed=0

          for src in assets/slideshow/*; do
            [ -f "$src" ] || continue
            name="$(basename "$src")"
            case "$name" in manifest.json|README.txt|.gitkeep) continue ;; esac

            ext="${name##*.}"
            ext="$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')"
            out="${src%.*}.webp"

            case "$ext" in
              heic|heif)
                tmp="$(mktemp --suffix=.png)"
                if ! decode_to_png "$src" "$tmp"; then
                  echo "::warning::could not read $name — leaving it alone"
                  rm -f "$tmp"
                  failed=1
                  continue
                fi
                convert "$tmp" -auto-orient -resize '1600x1600>' -quality 82 -strip "$out"
                rm -f "$tmp" "$src"
                echo "converted $name -> $(basename "$out")"
                ;;
              jpg|jpeg|png|tif|tiff|bmp)
                if ! convert "$src" -auto-orient -resize '1600x1600>' -quality 82 -strip "$out"; then
                  echo "::warning::could not read $name — leaving it alone"
                  failed=1
                  continue
                fi
                rm -f "$src"
                echo "converted $name -> $(basename "$out")"
                ;;
              webp)
                # An upper-case .WEBP would be missed by the listing below.
                if [ "$src" != "$out" ]; then
                  mv "$src" "$out"
                  src="$out"
                  echo "renamed $name -> $(basename "$out")"
                fi
                # Re-encode only if it is larger than we serve.
                width="$(identify -format '%w' "$src")"
                height="$(identify -format '%h' "$src")"
                if [ "$width" -gt 1600 ] || [ "$height" -gt 1600 ]; then
                  convert "$src" -auto-orient -resize '1600x1600>' -quality 82 -strip "$src"
                  echo "shrank $(basename "$src")"
                fi
                ;;
              *)
                echo "skipping unsupported file: $name"
                ;;
            esac
          done

      - name: Rebuild the slideshow list
        run: |
          set -euo pipefail
          cd assets/slideshow
          ls -1 *.webp 2>/dev/null | sort | jq -R . | jq -sc . > manifest.json
          cat manifest.json

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain assets/slideshow)" ]; then
            echo "nothing to do"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/slideshow
          git commit -m 'Prepare slideshow photos [skip ci]'
          git push
