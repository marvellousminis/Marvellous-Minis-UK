<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Concept sketch of an armoured miniature, standing in for a photo of the painter">
  <title>Concept sketch placeholder</title>

  <defs>
    <!-- Faint squared paper, like a page out of a sketchbook -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0v25" fill="none" stroke="#1b2228" stroke-width="1"/>
    </pattern>

    <!-- Drawn once on the left, mirrored down the centre line, so the armour
         stays symmetrical the way a real construction sketch would. -->
    <g id="limb" fill="none" stroke="#a9853f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <!-- Pauldron: the broad angular plate that carries the silhouette -->
      <path d="M168 184l-42-4c-12 2-19 14-20 30l2 30 40 8 20-20z"/>
      <path d="M134 190l-8 22 4 34" stroke-width="1.5"/>
      <path d="M112 216l36 6" stroke-width="1.5"/>
      <!-- Upper arm and forearm -->
      <path d="M128 250l24 4-6 48-24-4z"/>
      <path d="M120 304l26 4-6 42-26-4z"/>
      <path d="M112 350l30 4 2 16-34-4z"/>
      <!-- Thigh, knee plate, shin, boot -->
      <path d="M170 302h-26l-4 60 26 2z"/>
      <path d="M138 364l30 2v16l-32-2z"/>
      <path d="M140 384l28 2-2 50-28-2z"/>
      <path d="M136 438l32 2 4 16h-40z"/>
    </g>
  </defs>

  <rect width="400" height="500" fill="#101418"/>
  <rect width="400" height="500" fill="url(#grid)"/>

  <!-- Construction lines: centre, shoulder, waist, knee -->
  <g stroke="#2b343c" stroke-width="1" stroke-dasharray="5 6" fill="none">
    <path d="M200 58v404"/>
    <path d="M86 212h228"/>
    <path d="M118 292h164"/>
    <path d="M126 372h148"/>
  </g>
  <circle cx="200" cy="148" r="44" fill="none" stroke="#2b343c" stroke-width="1" stroke-dasharray="5 6"/>

  <g fill="none" stroke="#a9853f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Helm: angular, with a vertical visor slot and a slight snout -->
    <path d="M178 126l22-10 22 10 4 30-8 22h-36l-8-22z"/>
    <path d="M194 136h12l2 30-8 8-8-8z"/>
    <path d="M182 178h36l-3 8h-30z"/>
    <!-- Gorget -->
    <path d="M176 186h48l-6 10h-36z"/>

    <!-- Chest and abdomen -->
    <path d="M172 188h56l10 50-10 46h-56l-10-46z"/>
    <path d="M200 196v88" stroke-width="1.5"/>
    <path d="M176 240h48M178 260h44M180 276h40" stroke-width="1.5"/>

    <!-- Hips -->
    <path d="M170 286h60l4 16h-68z"/>
  </g>

  <use href="#limb"/>
  <use href="#limb" transform="translate(400,0) scale(-1,1)"/>

  <!-- Base -->
  <ellipse cx="200" cy="462" rx="94" ry="16" fill="none" stroke="#6b5530" stroke-width="2"/>

  <!-- Sheet marks, the way a working sketch gets annotated -->
  <g stroke="#3a454e" stroke-width="1.4" fill="none">
    <path d="M28 28h26M28 28v26"/>
    <path d="M372 28h-26M372 28v26"/>
    <path d="M28 472h26M28 472v-26"/>
    <path d="M372 472h-26M372 472v-26"/>
  </g>
</svg>
